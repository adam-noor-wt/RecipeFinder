name: Claude Android Developer Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write      # Allows Claude to push code to a new branch
  issues: read         # Allows Claude to read ticket details
  pull-requests: write # Allows Claude to open the PR
  id-token: write

jobs:
  claude-android-generation:
    if: github.event.label.name == 'claude-bot'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Android projects require Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Makes sure the gradlew execution script is executable
      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      # Run unit tests before Claude touches anything to ensure a healthy baseline
      - name: Run Baseline Local Unit Tests
        run: ./gradlew testDebugUnitTest --continue || echo "Baseline tests failed or don't exist"

      - name: Create New Branch
        run: |
          BRANCH_NAME="claude-fix-issue-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      # Ask Claude to Resolve the Android Issue using the official repository
      - name: Ask Claude to Resolve Android Issue
        id: claude-agent
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.fuelix.ai
        with:
          claude_code_oauth_token: ${{secrets.FUELIX_API_KEY}}
          show_full_output: true
          claude_args: |
            --permission-mode bypassPermissions
          prompt: |
            You are an autonomous Senior Android Developer. Your task is to resolve the following GitHub Issue.
            
            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}
            
            Guidelines:
            1. Search for the relevant Kotlin/Java source files, layout XMLs, or build.gradle files.
            2. Implement the complete solution requested in the issue.
            3. Ensure your changes compile cleanly via Gradle. Do not break existing architectures or dependencies.
          # This flag allows Claude to safely write code to files headlessly in CI
          acknowledge-dangerously-skip-permissions-responsibility: "true"

      # Compile and verify Claude's changes with local Android unit tests
      - name: Compile and Run Unit Tests
        run: |
          ./gradlew compileDebugSources
          ./gradlew testDebugUnitTest

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          git config user.name "claude-bot[bot]"
          git config user.email "claude-bot[bot]@users.noreply.github.com"

          git add -A

          # Skip cleanly if Claude made no changes (git commit exits 1 otherwise)
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "fix(android): automatically resolved issue #${ISSUE_NUMBER} via Claude"

          # Fall back to the current branch if BRANCH_NAME wasn't set earlier
          BRANCH="${BRANCH_NAME:-$(git rev-parse --abbrev-ref HEAD)}"

          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${BRANCH}"
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          BRANCH="${BRANCH_NAME:-$(git rev-parse --abbrev-ref HEAD)}"

          # Skip if a PR for this branch already exists
          if [ -n "$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')" ]; then
            echo "PR already exists for $BRANCH."
            exit 0
          fi

          gh pr create \
            --title "Closes #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body "This PR was automatically generated by Claude to resolve Android issue #${ISSUE_NUMBER}." \
            --head "$BRANCH" \
            --base main
