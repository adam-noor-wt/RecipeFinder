name: Claude Android Developer Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write      # Allows Claude to push code to a new branch
  issues: read         # Allows Claude to read ticket details
  pull-requests: write # Allows Claude to open the PR
  id-token: write

jobs:
  claude-android-generation:
    if: github.event.label.name == 'claude-bot'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Android projects require Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Makes sure the gradlew execution script is executable
      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      # Run unit tests before Claude touches anything to ensure a healthy baseline
      - name: Run Baseline Local Unit Tests
        run: ./gradlew testDebugUnitTest --continue || echo "Baseline tests failed or don't exist"

      - name: Create New Branch
        run: |
          BRANCH_NAME="claude-fix-issue-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      # Ask Claude to Resolve the Android Issue using the official repository
      - name: Ask Claude to Resolve Android Issue
        id: claude-agent
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.fuelix.ai
        with:
          claude_code_oauth_token: ${{secrets.FUELIX_API_KEY}}
          show_full_output: true
          claude_args: |
            --permission-mode bypassPermissions
          prompt: |
            You are an autonomous Senior Android Developer. Your task is to resolve the following GitHub Issue.
            
            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}
            
            Guidelines:
            1. Search for the relevant Kotlin/Java source files, layout XMLs, or build.gradle files.
            2. Implement the complete solution requested in the issue.
            3. Ensure your changes compile cleanly via Gradle. Do not break existing architectures or dependencies.
          # This flag allows Claude to safely write code to files headlessly in CI
          acknowledge-dangerously-skip-permissions-responsibility: "true"

      # Compile and verify Claude's changes with local Android unit tests
      - name: Compile and Run Unit Tests
        run: |
          ./gradlew compileDebugSources
          ./gradlew testDebugUnitTest

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "claude-bot[bot]"
          git config --global user.email "claude-bot[bot]@://github.com"
          git add .
          git commit -m "fix(android): automatically resolved issue #${{ github.event.issue.number }} via Claude"
          git push origin ${{ env.BRANCH_NAME }}

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Closes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" \
            --body "This PR was automatically generated by Claude 3.5 Sonnet to resolve Android issue #${{ github.event.issue.number }}." \
            --head ${{ env.BRANCH_NAME }} \
            --base main
